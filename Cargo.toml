[package]
name = "minuter"
version = "0.1.0"
edition = "2024"
description = "Standalone second and minute time cues, based on Andre Louis's Minuter"

[dependencies]
wxdragon = "=0.9.22"
cpal = "0.16"
hound = "3.5"
prismer = { version = "=0.1.4", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"


[build-dependencies]
embed-resource = "1.8"
